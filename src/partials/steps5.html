<section class="section section--alt">
  <div class="wrap">

      <p class="lede">Мы делаем интерактивную фотозону под ключ: изучаем зал, проектируем стойку и свет, готовим сюжеты под вашу тему и запускаем. Гость фотографируется, выбирает свой мир и уносит снимок, а музей получает новый аттракцион и аренду.</p>
    </div>

      <li><button class="flow__step" type="button" data-cap="Сюжеты под вашу тему" aria-pressed="false"><span class="flow__num">03</span><span class="flow__txt">Совместно со специалистами по CG разрабатывают изображения, которые будут получаться у гостей вашего объекта.</span><span class="flow__bar"><i></i></span></button></li>
      <li><button class="flow__step" type="button" data-cap="Показываем зону и готовые кадры" aria-pressed="false"><span class="flow__num">04</span><span class="flow__txt">Мы презентуем вам варианты фотозон и изображения, которые будут получаться на выходе.</span><span class="flow__bar"><i></i></span></button></li>

      <figure class="flow__view">
      <img class="is-on" decoding="async" src="assets/img/steps/s1.jpg" alt="Картинная галерея музея: зал, который станет площадкой" width="1200" height="900">
      <img class="" loading="lazy" decoding="async" src="assets/img/steps/s2.jpg" alt="Схема интерактивной фотостойки с экраном, камерой и принтером" width="1200" height="900">
      <img class="" loading="lazy" decoding="async" src="assets/img/steps/s3.jpg" alt="Четыре семейных портрета в образах: бал, палуба, кабинет редкостей, белые ночи" width="1200" height="900">

      <img class="" loading="lazy" decoding="async" src="assets/img/steps/s5.jpg" alt="Вид сверху: гости у работающей фотозоны получают снимки" width="1200" height="900">
