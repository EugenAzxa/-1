<section class="finale" aria-label="Связаться">

{{include:ring-b}}  </div>
  <div class="wrap finale__inner">
    <p class="finale__lead">Будем рады разработать идею фотозоны для вашего объекта.</p>
    <a class="finale__call" href="tel:{{phone_href}}">
      <svg width="30" height="30" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 3h3l1.5 4-2 1.5a11 11 0 005 5L13 11.5 17 13v3a1 1 0 01-1 1A13 13 0 013 4a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      {{phone}}
    </a>
    <p class="finale__who">{{manager}}, по всем вопросам</p>
  </div>
</section>
