<section class="section section--tight">
  <div class="wrap">
    <div class="cta cta--call reveal">
      <div>
        <span class="eyebrow">Связаться</span>
        <h2>Позвоните - обсудим вашу площадку</h2>
        <p class="lede" style="margin-top:18px">Будем рады разработать уникальную и креативную идею фотозоны для вашего объекта.</p>
      </div>
      <div class="call">
        <a class="btn btn--primary btn--call" href="tel:{{phone_href}}">
          <svg width="22" height="22" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 3h3l1.5 4-2 1.5a11 11 0 005 5L13 11.5 17 13v3a1 1 0 01-1 1A13 13 0 013 4a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          {{phone}}
        </a>
        <p class="call__who">{{manager}}, по всем вопросам</p>
      </div>
    </div>
  </div>
</section>
